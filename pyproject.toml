[project]
name = "lumiread"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.32,<1", "httpx>=0.28,<1",
  "pydantic>=2.10,<3", "pillow>=11,<13", "python-multipart>=0.0.20,<1",
  "python-dotenv>=1,<2", "cryptography>=44", "qrcode>=8,<9",
  "sympy>=1.13,<2", "pillow-heif>=0.22"
]
[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.17.6",
]
[tool.pytest.ini_options]
testpaths = ["tests"]
